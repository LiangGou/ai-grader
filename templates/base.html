<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}AI Grader{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20261009e">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> AI Grader</a>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('settings_page') }}">Settings</a>
    <form method="post" action="{{ url_for('logout_page') }}" style="display:inline"><button type="submit" class="linkbtn">Logout</button></form>
  </nav>
</header>
{% if env is defined and not env.key_set %}
<div class="warn-banner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> No OpenAI API key configured — grading is unavailable. <a href="{{ url_for('settings_page') }}">Go to Settings →</a></div>
{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
<div id="lightbox"><button class="lb-close" aria-label="Close">×</button><img alt="Enlarged image"></div>
<script src="{{ url_for('static', filename='app.js') }}?v=20261007b"></script>
</body>
</html>
