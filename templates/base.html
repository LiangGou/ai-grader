<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}AI Grader{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">📝 AI Grader</a>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('settings_page') }}">Settings</a>
  </nav>
</header>
{% if env is defined and not env.key_set %}
<div class="warn-banner">⚠️ No OpenAI API key configured — grading is unavailable. <a href="{{ url_for('settings_page') }}">Go to Settings →</a></div>
{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
<div id="lightbox"><button class="lb-close" aria-label="Close">×</button><img alt="Enlarged image"></div>
<script src="{{ url_for('static', filename='app.js') }}?v=20261005i"></script>
</body>
</html>
