<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - AI Grader</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 20px; }
h2 { text-align: center; }
input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
button { width: 100%; padding: 12px; background: #1a56db; color: #fff; border: none; font-size: 16px; border-radius: 8px; }
.err { color: #c00; text-align: center; }
</style>
</head>
<body>
<h2>📝 AI Grader</h2>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
<input name="username" placeholder="Username" autocomplete="username" required>
<input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
<button type="submit">Log in</button>
</form>
</body>
</html>
